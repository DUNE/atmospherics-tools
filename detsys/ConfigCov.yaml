Samples:
  - Name: "Nominal" #Sample Identifier name
    FilePath: "/exp/dune/data/users/cdalmazz/gitTools/atmospherics-tools/detsys/data/MCSTAT/Nominal_600/"
    SubDirectoryName: "cafmaker" #The CAF files are expected to contain the 'cafTree', 'meta' and 'genieEvt' TTrees. Sometimes, but not all the time, these TTrees are contained in a subdirectory (i.e. 'cafmaker')
    Colour: 1 #Colour from ROOT Colour Wheel
    LineStyle: 1
    FixCVN: true
    isRef: true
  - Name: "#splitline{Detector variation}{Mod. Box A = 0.99}"     
    FilePath: "/exp/dune/data/users/cdalmazz/gitTools/atmospherics-tools/detsys/data/MCSTAT/NodBoxA0_99_600/"
    SubDirectoryName: "cafmaker"
    Colour: 807
    LineStyle: 1
    FixCVN: true
  - Name: "#splitline{Detector variation}{Mod. Box A = 0.87}"
    FilePath: "/exp/dune/data/users/cdalmazz/gitTools/atmospherics-tools/detsys/data/MCSTAT/NodBoxA0_87_600/" 
    SubDirectoryName: "cafmaker"
    Colour: 865
    LineStyle: 1
    FixCVN: true
#
#The next node defines the bins which would be used in some oscillation analysis. By defining the analysis bins, we can calculate the change in normalisation of each analysis bin for a variation of a parameter. This can then be used to calculate a covariance matrix to include bin-to-bin correlations.

#The number of axes [and bin edges per axis] for each selection can be any number and the number of axes does not have to be identical per each selection. The analysis binning 1D distribution counts up in indices of the minor axis, then major axis. For the example:


AnalysisBinning:
  - Selection: "NuMu" #Selection Name
    kSelection: 1 #Index which matches one of the selection enums defined here: https://github.com/DUNE/atmospherics-tools/blob/b25e0400f2a571a4e4b6e4bddee58579e7dc37b0/detsys/src/Constants.h#L5-L10
    kNuRecoCosZ: [-1.001, 1.001]
    kNuERec: [0.0, 0.12, 0.22, 0.37, 0.63, 1.5, 4, 11, 19, 32, 10000.0] #gundam
  - Selection: "NuE"
    kSelection: 0
    kNuRecoCosZ: [-1.001, 1.001]
    kNuERec: [0.0, 0.07, 0.1, 0.15, 0.22, 0.33, 0.47, 0.7, 1.1, 1.7, 2.9, 5, 9, 16, 32, 48, 10000.0] #gundam
 
#The way in which variables are grabbed from the MC is as follows:
#First, the [Observables][Axes][Variable] string is converted to an enum here: https://github.com/DUNE/atmospherics-tools/blob/b25e0400f2a571a4e4b6e4bddee58579e7dc37b0/detsys/src/Constants.h#L17-L34

#Second, the mapping of that enum to a CAF variable is done through this function: https://github.com/DUNE/atmospherics-tools/blob/b25e0400f2a571a4e4b6e4bddee58579e7dc37b0/detsys/src/Reader.cxx#L131-L141
#This returns any variable stored in the 'Data' struct: https://github.com/DUNE/atmospherics-tools/blob/b25e0400f2a571a4e4b6e4bddee58579e7dc37b0/detsys/src/Data.h#L6
#Which get filled from the CAF file e.g. here: https://github.com/DUNE/atmospherics-tools/blob/b25e0400f2a571a4e4b6e4bddee58579e7dc37b0/detsys/src/Reader.cxx#L150

Observables:


  - Name: "Reco Neutrino Energy"
    Axes:
      - Variable: "kNuERec"
        IsLog: true
        Label: "Reco Neutrino Energy [GeV]"
        Binning: [0.05,0.2,0.4,0.6,0.8,1.2,1.6,2.0,4.0,10.]


  - Name: "Reco Neutrino Energy - True CC #nu_{e}"
    Axes:
      - Variable: "kNuERec"
        IsLog: true
        Label: "Reco Neutrino Energy [GeV]"
        Binning: [0.05,  0.23, 0.31, 0.47, 0.81, 1.28, 1.99, 3.17, 5.38, 10] #[0.05,0.2,0.4,0.6,0.8,1.2,1.6,2.0,4.0,10.]
    Cuts:
      - Variable: "kTrueInt"
        LowerBound: 0.5
        UpperBound: 1.5


  - Name: "Reco Neutrino Energy - True CC #nu_{#mu}"
    Axes:
      - Variable: "kNuERec"
        IsLog: true
        Label: "Reco Neutrino Energy [GeV]"
        Binning: [0.05, 0.23, 0.31, 0.47, 0.81, 1.28, 1.99, 5.38, 10]
    Cuts:
      - Variable: "kTrueInt"
        LowerBound: 1.5
        UpperBound: 2.5


  - Name: "Reco Neutrino Energy - True NC"
    Axes:
      - Variable: "kNuERec"
        IsLog: true
        Label: "Reco Neutrino Energy [GeV]"
        Binning: [0.05, 0.23, 0.31, 0.47, 0.81, 1.28, 1.99, 5.38, 10]
    Cuts:
      - Variable: "kTrueInt"
        LowerBound: 2.5
        UpperBound: 3.5



  - Name: "CVN CC #nu_{#mu}"
    Axes:
      - Variable: "kCVNNuMu"
        Label: "CVN CC #nu_{#mu} score"
        #BinDefinition: [10,0.,1.]
        Binning: [0, 0.1, 0.56, 0.9, 1]


  - Name: "CVN CC #nu_{e}"
    Axes:
      - Variable: "kCVNNuE"
        Label: "CVN CC #nu_{e} score"
        #BinDefinition: [10,0.,1.]
        Binning: [0, 0.1, 0.55, 0.9, 1]


